[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "httk-data"
version = "0.2.0"
description = "httk₂ module for data management: entry providers, property-definition validation, and database storage."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Rickard Armiento", email = "gitcommits@armiento.net" }]
dependencies = [
  "httk-core>=2.0.2,<3",
  "jsonschema>=4",
]
keywords = [
  "Materials Discovery",
  "Materials Informatics",
  "Materials Science",
  "Machine Learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://httk.org"
Documentation = "https://docs.httk.org/httk-data/"
Repository = "https://github.com/httk/httk-data"
Issues = "https://github.com/httk/httk-data/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "black",
  "ruff",
  "isort",
  "pyright",
  "mypy",
  "sqlalchemy>=2.0,<3"
]
docs = [
  "sphinx",
  "furo",
  "myst-parser",
  "myst-nb",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "sphinx-autoapi"
]
release = [
  "build>=1.2",
  "twine>=6.0",
]
default = ["httk-data[db]"]
db = ["sqlalchemy>=2.0,<3"]
duckdb = ["httk-data[db]", "duckdb_engine>=0.13", "duckdb>=1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"httk.data" = ["py.typed"]
"httk.handlers.data" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.ruff]
target-version = "py312"
src = ["src", "examples"]

[tool.black]
target-version = ["py312"]
line-length = 120
skip-string-normalization = true

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "examples"]
# The examples import httk as an installed package would, so point pyright at
# the in-tree sources; ../httk-optimade/src resolves the cross-repo serving
# example (httk-optimade is a consumer of this package, never a dependency of
# it) against its workspace checkout, and is harmless where that path does not
# exist. Listing extraPaths explicitly disables pyright's implicit use of ./src,
# so "src" is listed too.
extraPaths = ["src", "../httk-optimade/src"]
# Resolve the httk-core runtime dependency (and jsonschema) against the shared
# workspace venv, where httk-core is installed editable; pyright falls back to
# default resolution where that venv does not exist (e.g. CI, where the deps are
# installed into the job env).
venvPath = ".."
venv = ".venv"
reportMissingImports = true

[tool.mypy]
python_version = "3.12"
files = ["src", "examples"]
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# jsonschema (a hard runtime dependency) ships no inline type information; we do
# not vendor its optional third-party stubs, so treat its imports as untyped.
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# httk-optimade is a *consumer* of this package, not a dependency of it: the two
# meet only at the httk.core.EntryProvider contract. The cross-repo example
# (examples/serve_as_optimade.py) imports it to show the serving end of that
# contract, so its import must typecheck whether httk-optimade is absent
# entirely or present without a py.typed marker.
module = ["httk.optimade", "httk.optimade.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
